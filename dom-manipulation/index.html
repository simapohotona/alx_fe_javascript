<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Quote Generator</title>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Button to show a random quote -->
  <button onclick="showRandomQuote()">Show Random Quote</button>
  <div id="quoteDisplay"></div>

  <!-- Form to add new quotes -->
  <div>
    <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
    <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
    <button onclick="addQuote()">Add Quote</button>
  </div>
    <!-- Controls for import/export -->
  <div>
    <input id="importFile" type="file" accept=".json" />
    <button id="exportBtn">Export Quotes (JSON)</button>
    <button id="clearBtn">Clear All Quotes</button>
  </div>

  <!-- Optional: show last viewed quote stored in session -->
  <div>
    <strong>Last viewed quote:</strong>
    <div id="lastViewed">None</div>
  </div>

  <!-- Where quotes will be displayed -->
  <ul id="quotesList"></ul>

  <script src="script.js"></script>
</body>
</html>
